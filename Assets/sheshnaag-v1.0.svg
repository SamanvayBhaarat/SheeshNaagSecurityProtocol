    <ellipse cx="110" cy="111" rx="4.5" ry="8" fill="#183f42"/>
    <circle cx="110" cy="111" r="2.4" fill="#f2c879"/>
    <path d="M80 57 Q110 48 140 57" fill="none" stroke="#83efd0" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="294" y="133" fill="#e8f0f8" font-size="82" font-weight="650" letter-spacing="-3">SheshNaag</text>
    <rect x="299" y="165" width="106" height="37" rx="18.5" fill="#193d3c" stroke="#367d70"/>
    <text x="352" y="190" fill="#83efd0" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.6">V 1.0</text>
    <text x="425" y="190" fill="#91a2b5" font-size="13" font-weight="550" letter-spacing="1">THREE ASH LINES. THE WATCHFUL THIRD EYE.</text>
  </g>
