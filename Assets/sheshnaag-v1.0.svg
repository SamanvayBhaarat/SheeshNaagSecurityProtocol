<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title description">
  <title id="title">SheshNaag v1.0</title>
  <desc id="description">Three sacred ash-white tilak lines with Shiva's Trinetra at the center.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172b3b"/>
      <stop offset="1" stop-color="#0d1928"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83efd0"/>
      <stop offset="1" stop-color="#48b99e"/>
    </linearGradient>
    <linearGradient id="ash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c6d0d7"/>
      <stop offset="0.5" stop-color="#f4f3e9"/>
      <stop offset="1" stop-color="#c6d0d7"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f1db"/>
      <stop offset="1" stop-color="#d5e1df"/>
    </linearGradient>
  </defs>
  <rect width="960" height="280" rx="24" fill="#0c1420"/>
  <g transform="translate(30 30)">
    <rect width="220" height="220" rx="54" fill="url(#tile)" stroke="#2b4657" stroke-width="2"/>
    <circle cx="110" cy="110" r="82" fill="none" stroke="#263e4d" stroke-width="1.5"/>
    <path d="M56 77 Q110 70 164 77" fill="none" stroke="url(#ash)" stroke-width="9" stroke-linecap="round"/>
    <path d="M42 110 H92 M128 110 H178" fill="none" stroke="url(#ash)" stroke-width="10" stroke-linecap="round"/>
    <path d="M56 143 Q110 150 164 143" fill="none" stroke="url(#ash)" stroke-width="9" stroke-linecap="round"/>
    <path d="M110 84
      C104 96 94 102 91 110
      C96 123 103 134 110 140
      C117 134 124 123 129 110
      C126 102 116 96 110 84Z"
